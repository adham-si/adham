[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Accepted duplicate versions. Each pin is exact so that a future version
# bump re-surfaces as a warning for review. All pairs below are forced by
# incompatible majors across the Tauri 2 and sqlx dependency trees and
# cannot be unified without upstream changes.
skip = [
    { name = "base64", version = "=0.21.7" },
    { name = "base64", version = "=0.22.1" },
    { name = "base64", version = "=0.23.1" },
    { name = "bitflags", version = "=1.3.2" },
    { name = "bitflags", version = "=2.13.2" },
    { name = "cpufeatures", version = "=0.2.17" },
    { name = "cpufeatures", version = "=0.3.1" },
    { name = "foldhash", version = "=0.1.5" },
    { name = "foldhash", version = "=0.2.0" },
    { name = "getrandom", version = "=0.2.17" },
    { name = "getrandom", version = "=0.3.4" },
    { name = "getrandom", version = "=0.4.3" },
    { name = "hashbrown", version = "=0.12.3" },
    { name = "hashbrown", version = "=0.15.5" },
    { name = "hashbrown", version = "=0.17.1" },
    { name = "heck", version = "=0.4.1" },
    { name = "heck", version = "=0.5.0" },
    { name = "indexmap", version = "=1.9.3" },
    { name = "indexmap", version = "=2.14.2" },
    { name = "miniz_oxide", version = "=0.8.9" },
    { name = "miniz_oxide", version = "=0.9.1" },
    { name = "png", version = "=0.17.16" },
    { name = "png", version = "=0.18.1" },
    { name = "proc-macro-crate", version = "=1.3.1" },
    { name = "proc-macro-crate", version = "=2.0.2" },
    { name = "serde_spanned", version = "=0.6.9" },
    { name = "serde_spanned", version = "=1.1.1" },
    { name = "syn", version = "=1.0.109" },
    { name = "syn", version = "=2.0.119" },
    { name = "syn", version = "=3.0.6" },
