[workspace]
resolver = "2"
members = [
    "crates/adham-core-types",
    "crates/adham-platform",
    "crates/adham-event-log",
    "crates/adham-projections",
    "crates/adham-desktop-api",
    "crates/adham-runtime",
    "crates/adham-provider",
    "crates/adham-tools",
    "crates/adham-verify",
    "crates/adham-graph",
    "apps/desktop/src-tauri",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Adham Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "uuid", "time"] }
blake3 = "1.5"
ts-rs = { version = "10.0", features = ["uuid-impl"] }
tokio = { version = "1.40", features = ["full"] }
