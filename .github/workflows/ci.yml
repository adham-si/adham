name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validation and Quality Checks
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee08c636ad5c42577177d4b23718 # v2.7.7

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Check file sizes
        run: node scripts/check-file-size.mjs

      - name: Biome formatting check
        run: pnpm format:check

      - name: Oxlint linting check
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Frontend unit & component tests
        run: pnpm test

      - name: Rust formatting check
        run: cargo fmt --all -- --check

      - name: Rust typecheck
        run: cargo check --workspace --all-targets

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
